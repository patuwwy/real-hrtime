name: CI and Prebuilds

on:
  push:
    branches: [ master, main, release/* ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master, main, release/* ]
  workflow_dispatch:

jobs:
  prebuild:
    name: Prebuild on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows
          - os: windows-latest
            arch: x64
            cmd: npm run prebuild
          - os: windows-latest
            arch: ia32
            cmd: npm run prebuild-ia32
          # macOS (Intel & Apple Silicon)
          - os: macos-13
            arch: x64
            cmd: npm run prebuild
          - os: macos-latest
            arch: arm64
            cmd: npm run prebuild
          # Linux
          - os: ubuntu-latest
            arch: x64
            cmd: npm run prebuild

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build prebuild
        run: ${{ matrix.cmd }}

      - name: Run tests
        run: npm test

      - name: Upload prebuild artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuild-${{ matrix.os }}-${{ matrix.arch }}
          path: prebuilds/

  release:
    name: Publish to npm
    needs: prebuild
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'

      - name: Download all prebuild artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilds-temp

      - name: Organize prebuilds
        run: |
          mkdir -p prebuilds
          cp -r prebuilds-temp/*/* prebuilds/ || true
          ls -la prebuilds/

      - name: Publish package to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
